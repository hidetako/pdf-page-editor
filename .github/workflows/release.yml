name: Windows installer

# タグ v1.2.3 を push すると、exe とインストーラーをビルドして GitHub Releases に公開する。
# 手動実行 (workflow_dispatch) では Artifacts にだけ残す。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (unit + GUI E2E, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_model.py
          python tests/test_stamps.py
          python tests/test_notes_toc.py
          python tests/test_e2e_gui.py

      - name: Determine version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version: $v"

      - name: Build exe (PyInstaller)
                # PyMuPDF 2.x のレイアウト解析モデルは不要なので除外（同梱すると起動時に layout_rf*.yaml を探して失敗する）
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PdfPageEditor --icon assets/icon.ico --add-data "assets/icon.ico;assets" --exclude-module pymupdf.layout --exclude-module onnxruntime --exclude-module pymupdf_layout app.py

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\PdfPageEditor.iss'

      - name: List outputs
        run: Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PdfPageEditor-${{ steps.ver.outputs.version }}
          path: |
            dist/PdfPageEditor-Setup-*.exe
            dist/PdfPageEditor.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PDF Page Editor ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/PdfPageEditor-Setup-*.exe
            dist/PdfPageEditor.exe
