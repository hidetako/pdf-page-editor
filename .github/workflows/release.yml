name: Windows installer

# main への push: テスト → exe とインストーラーをビルド。app.py の __version__ に対応するタグ vX.Y.Z が
# まだ無ければ、そのコミットにタグを打って GitHub Releases に公開する（= バージョンを上げてマージすれば自動リリース）。
# タグ vX.Y.Z の push: そのタグでビルドして Releases に公開（手動リリース用）。
# 手動実行 (workflow_dispatch): ビルドして Artifacts に残すだけ。

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # GUI E2E は Linux のオフスクリーンで検証する（開発環境と同じ条件で安定）。これが通らなければリリースしない。
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (unit + GUI E2E, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_model.py
          python tests/test_stamps.py
          python tests/test_notes_toc.py
          python tests/test_updater.py
          python tests/test_write.py
          python tests/test_fields.py
          python tests/test_e2e_gui.py

  build:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"            # Windows ランナーの標準出力は cp1252 なので、日本語の出力で落ちないように UTF-8 にする
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_model.py
          python tests/test_stamps.py
          python tests/test_notes_toc.py
          python tests/test_updater.py
          python tests/test_write.py
          python tests/test_fields.py

      - name: Run GUI E2E on Windows (参考。Windows のオフスクリーンはフォント無し・寸法差があり、必須にしない)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/test_e2e_gui.py

      - name: Determine version and whether to publish
        id: ver
        shell: bash
        run: |
          app_version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app.py', encoding='utf-8').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; publish=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            v="$app_version"
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
              echo "tag v$v already exists: build only"; publish=false
            else
              publish=true
            fi
          else
            v="$app_version-dev.${GITHUB_SHA::7}"; publish=false
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version: $v  publish: $publish"

      - name: Build exe (PyInstaller)
        # PyMuPDF 2.x のレイアウト解析モデルは不要なので除外（同梱すると起動時に layout_rf*.yaml を探して失敗する）。
        # hooks/hook-pymupdf.py は、PyMuPDF の付属データ（ONNX モデルなど約 43 MB）を同梱させないための置き換えフック
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PdfPageEditor --icon assets/icon.ico --add-data "assets/icon.ico;assets" --add-data "assets/icons;assets/icons" --additional-hooks-dir hooks --exclude-module pymupdf.layout --exclude-module onnxruntime --exclude-module pymupdf_layout app.py

      - name: Check exe size
        # 依存パッケージの更新で、気付かないうちに配布サイズが膨らむことがある（1.5.0 で 73 MB → 116 MB になった）。公開は止めず、警告だけ出す
        shell: pwsh
        run: |
          $mb = [math]::Round((Get-Item dist\PdfPageEditor.exe).Length / 1MB, 1)
          Write-Host "PdfPageEditor.exe: $mb MB"
          if ($mb -gt 95) { Write-Host "::warning::PdfPageEditor.exe is $mb MB (expected about 73 MB). A dependency may be bundling extra data." }

      - name: Self-test the packaged exe
        # まとめた exe の中でも書き込み機能（埋め込みフォントの文字など）が動くか確かめる。失敗したら公開しない
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'selftest.log'
          $p = Start-Process -FilePath dist\PdfPageEditor.exe -ArgumentList '--selftest', $log -Wait -PassThru
          if (Test-Path $log) { Get-Content $log -Encoding utf8 }
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\PdfPageEditor.iss'

      - name: Check that the installer can relaunch the app after an in-app update
        # アプリ内の自動アップデートでは、動いていたアプリ（PyInstaller の 1 ファイル版 exe）の環境変数がインストーラーに引き継がれる。
        # そのままアプリを起動し直すと、古い一時フォルダーを使おうとして「Failed to load Python DLL」で失敗する（1.5.1 までの不具合）。
        # 同じ状況の環境変数を作り、インストーラーが /LAUNCH=1 で起動し直したアプリが画面を出せるか確かめる。失敗したら公開しない
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ppe-install'
          $exe = Join-Path $dir 'PdfPageEditor.exe'
          $marker = Join-Path $env:RUNNER_TEMP 'ppe-started.txt'
          $setup = (Get-ChildItem dist\PdfPageEditor-Setup-*.exe | Select-Object -First 1).FullName
          $common = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir"

          # 1) まず普通にインストールする（起動はしない）
          $p = Start-Process -FilePath $setup -ArgumentList $common -PassThru
          $null = $p.Handle          # 終了コードを後で読めるように、ハンドルを先に確保しておく
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'installer did not finish' }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $exe)) { throw "install failed (exit code $($p.ExitCode))" }

          # 2) 「古いアプリから引き継いだ」環境変数を再現する（一時フォルダーはもう無い）
          $env:_PYI_ARCHIVE_FILE = $exe
          $env:_PYI_APPLICATION_HOME_DIR = Join-Path $env:RUNNER_TEMP '_MEI_removed'
          $env:_PYI_PARENT_PROCESS_LEVEL = '1'

          # 3) 対照: この環境変数のまま exe を直接起動すると失敗する（エラー画面で止まるか、異常終了する）はず
          $log = Join-Path $env:RUNNER_TEMP 'selftest-stale.log'
          $c = Start-Process -FilePath $exe -ArgumentList '--selftest', $log -PassThru
          $null = $c.Handle
          if ($c.WaitForExit(20000)) {
            if ($c.ExitCode -eq 0) { Write-Host '::warning::control run succeeded: the stale environment no longer breaks a direct launch, so this check proves less than intended' }
            else { Write-Host "control: direct launch with the stale environment failed as expected (exit code $($c.ExitCode))" }
          } else {
            Write-Host 'control: direct launch with the stale environment is stuck on an error dialog, as expected'
            Get-Process PdfPageEditor -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

          # 4) 本番: 同じ環境変数のままインストーラーを /LAUNCH=1 で実行し、起動し直されたアプリが画面を出すのを待つ
          $env:PDFPE_STARTED_MARKER = $marker
          $p = Start-Process -FilePath $setup -ArgumentList ($common + '/LAUNCH=1') -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'installer did not finish' }
          if ($p.ExitCode -ne 0) { throw "update install failed (exit code $($p.ExitCode))" }
          $ok = $false
          foreach ($i in 1..90) { if (Test-Path $marker) { $ok = $true; break }; Start-Sleep -Seconds 1 }
          Get-Process PdfPageEditor -ErrorAction SilentlyContinue | Format-Table Id, MainWindowTitle, StartTime | Out-String | Write-Host
          Get-Process PdfPageEditor -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw 'the app relaunched by the installer did not start' }
          $started = Get-Content $marker
          Write-Host "relaunched app started: version $started"
          # リボンのアイコン（assets/icons）が配布物に入っていて、まとめた exe の中で読めているか
          if ($started -notmatch 'missing_icons=0') { throw "ribbon icons are missing in the packaged app: $started" }

      - name: List outputs
        run: Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PdfPageEditor-${{ steps.ver.outputs.version }}
          path: |
            dist/PdfPageEditor-Setup-*.exe
            dist/PdfPageEditor.exe

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PDF Page Editor ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/PdfPageEditor-Setup-*.exe
            dist/PdfPageEditor.exe
