name: Windows installer

# main への push: テスト → exe とインストーラーをビルド。app.py の __version__ に対応するタグ vX.Y.Z が
# まだ無ければ、そのコミットにタグを打って GitHub Releases に公開する（= バージョンを上げてマージすれば自動リリース）。
# タグ vX.Y.Z の push: そのタグでビルドして Releases に公開（手動リリース用）。
# 手動実行 (workflow_dispatch): ビルドして Artifacts に残すだけ。

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # GUI E2E は Linux のオフスクリーンで検証する（開発環境と同じ条件で安定）。これが通らなければリリースしない。
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries and CJK fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0 fonts-noto-cjk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (unit + GUI E2E, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/test_model.py
          python tests/test_stamps.py
          python tests/test_notes_toc.py
          python tests/test_e2e_gui.py

  build:
    needs: test-linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"            # Windows ランナーの標準出力は cp1252 なので、日本語の出力で落ちないように UTF-8 にする
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_model.py
          python tests/test_stamps.py
          python tests/test_notes_toc.py

      - name: Run GUI E2E on Windows (参考。Windows のオフスクリーンはフォント無し・寸法差があり、必須にしない)
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/test_e2e_gui.py

      - name: Determine version and whether to publish
        id: ver
        shell: bash
        run: |
          app_version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('app.py', encoding='utf-8').read()).group(1))")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"; publish=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            v="$app_version"
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
              echo "tag v$v already exists: build only"; publish=false
            else
              publish=true
            fi
          else
            v="$app_version-dev.${GITHUB_SHA::7}"; publish=false
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version: $v  publish: $publish"

      - name: Build exe (PyInstaller)
        # PyMuPDF 2.x のレイアウト解析モデルは不要なので除外（同梱すると起動時に layout_rf*.yaml を探して失敗する）
        run: pyinstaller --noconfirm --clean --onefile --windowed --name PdfPageEditor --icon assets/icon.ico --add-data "assets/icon.ico;assets" --exclude-module pymupdf.layout --exclude-module onnxruntime --exclude-module pymupdf_layout app.py

      - name: Build installer (Inno Setup)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\PdfPageEditor.iss'

      - name: List outputs
        run: Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: PdfPageEditor-${{ steps.ver.outputs.version }}
          path: |
            dist/PdfPageEditor-Setup-*.exe
            dist/PdfPageEditor.exe

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PDF Page Editor ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/PdfPageEditor-Setup-*.exe
            dist/PdfPageEditor.exe
